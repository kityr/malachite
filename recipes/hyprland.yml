---
# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
# recipes/hyprland.yml
# Sub-recipe containing Hyprland compositor, utilities, libraries, and plugins

modules:
  - type: dnf
    repos:
      copr:
        - lionheartp/Hyprland
    install:
      packages:
        # Hyprland Compositor & Essential Ecosystem
        - hyprland
        - xdg-desktop-portal-hyprland
        - hyprpolkitagent
        - uwsm
        - hyprpaper
        - hyprlock
        - hypridle
        - hyprsunset
        - noctalia-hyprland-meta

        # Hyprland Headers and Subsystem Development Libraries
        - hyprland-devel
        - aquamarine-devel
        - hyprutils-devel
        - hyprlang-devel
        - hyprcursor-devel
        - hyprgraphics-devel
        - hyprwire-devel
        - hyprland-protocols-devel

        # Graphics / EGL / GLES3 & Shader Compilers
        - libglvnd-devel
        - mesa-libEGL-devel
        - mesa-libGL-devel
        - mesa-libgbm-devel
        - glslang-devel

        # Wayland, Input, & Window Management
        - wayland-devel
        - wayland-protocols-devel
        - libxkbcommon-devel
        - libinput-devel
        - libdrm-devel
        - pixman-devel
        - cairo-devel
        - pango-devel
        - libXcursor-devel
        - libxcb-devel
        - xcb-util-devel
        - xcb-util-wm-devel
        - xcb-util-renderutil-devel
        - xcb-util-errors-devel
        - libseat-devel
        - libdisplay-info-devel
        - libliftoff-devel
        - libeis-devel

        # Math, Parsing, and Utilities
        - re2-devel
        - muParser-devel
        - lcms2-devel
        - libuuid-devel
        - tomlplusplus-devel
        - glaze-devel
        - sdbus-cpp-devel
        - lua-devel

        # Build Tooling
        - gcc
        - gcc-c++
        - cmake
        - meson
        - cpio
        - git-core

  # Declarative Hyprland Plugins built during image assembly
  - type: hyprland-plugins
    source: local
    destination: /usr/lib64/hyprland/plugins
    plugins:
      - url: https://github.com/hyprnux/hyprglass
      - url: https://github.com/fedsfarm/gloview
